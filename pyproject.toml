[project]
name = "agenthon-t1-harness"
version = "0.2.1"
description = "Agenthon T1 coding agent with isolated execution and independent public evaluation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.2,<3", "pandas>=2.2,<4", "scipy>=1.15,<2", "pyarrow>=19,<26",
  "scikit-learn>=1.6,<2", "statsmodels>=0.14,<0.15", "numba>=0.61,<1",
  "matplotlib>=3.10,<4", "polars==1.39.3", "arch>=7,<9", "openpyxl>=3.1,<4",
  "plotly>=6,<7", "lxml>=6,<7", "sympy>=1.14,<2",
  "pytest>=8,<10", "pytest-json-report>=1.5,<2", "pytest-timeout>=2.3,<3",
]

[project.scripts]
t1-harness = "t1_agent.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["t1_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
