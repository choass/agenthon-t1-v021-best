name: publish-t1-v034-contract
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: agenthon-t1-v034:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - name: Test request accounting
        run: docker run --rm --network none -v "$PWD/tests:/ci-tests:ro" --entrypoint python agenthon-t1-v034:ci -m unittest discover -s /ci-tests -p 'test_*.py' -v
      - name: Test official-style container restrictions
        run: |
          mkdir -p smoke-output
          chmod 777 smoke-output
          docker run --rm --read-only --user 65534:65534 --cap-drop ALL \
            --security-opt no-new-privileges --network none --pids-limit 256 \
            --ulimit nofile=1024:1024 --ulimit nproc=256:256 --ulimit fsize=67108864:67108864 --cpus 2 --memory 4g --memory-swap 4g \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            -v "$PWD/tests/fixture:/input:ro" -v "$PWD/tests:/ci-tests:ro" \
            -v "$PWD/smoke-output:/output:rw" -v "$PWD/smoke-output:/app/output:rw" \
            --entrypoint python agenthon-t1-v034:ci /ci-tests/container_smoke.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          docker tag agenthon-t1-v034:ci "$IMAGE:v034-contract-sha-$REVISION"
          docker tag agenthon-t1-v034:ci "$IMAGE:v034-contract"
          docker push "$IMAGE:v034-contract-sha-$REVISION"
          docker push "$IMAGE:v034-contract"
          docker image inspect "$IMAGE:v034-contract-sha-$REVISION" --format '{{json .RepoDigests}}' > image-digests.json
          cat image-digests.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: image-digests.json
